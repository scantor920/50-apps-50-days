<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: rgba(255,255,255,0.75);
            font-size: 0.95rem;
            margin-bottom: 36px;
            text-align: center;
        }

        /* ── Container ── */
        .app {
            width: 100%;
            max-width: 640px;
        }

        /* ── Add Task Form ── */
        .add-form {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            margin-bottom: 24px;
        }

        .add-form h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input[type="text"]:focus {
            border-color: #11998e;
        }

        .meta-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, input[type="date"] {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus, input[type="date"]:focus {
            border-color: #11998e;
        }

        .add-btn {
            margin-left: auto;
            padding: 10px 24px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(17,153,142,0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(17,153,142,0.4);
        }

        /* ── Filter / Summary Bar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #11998e;
            border-color: white;
        }

        .summary {
            margin-left: auto;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        /* ── Task List ── */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .empty-state {
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: rgba(255,255,255,0.85);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .task-card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: all 0.25s;
            border-left: 4px solid transparent;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transform: translateX(2px);
        }

        .task-card.priority-high   { border-left-color: #ff5252; }
        .task-card.priority-medium { border-left-color: #ffab40; }
        .task-card.priority-low    { border-left-color: #69f0ae; }

        .task-card.done {
            opacity: 0.6;
        }

        /* Checkbox */
        .task-check {
            width: 22px;
            height: 22px;
            border: 2px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .task-check.checked {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-color: #11998e;
            color: white;
        }

        .task-check.checked::after {
            content: '✓';
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Task body */
        .task-body {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 1rem;
            color: #333;
            word-break: break-word;
            transition: all 0.2s;
        }

        .task-card.done .task-text {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-high   { background: #ffe5e5; color: #ff5252; }
        .badge-medium { background: #fff3e0; color: #f57c00; }
        .badge-low    { background: #e8f5e9; color: #43a047; }
        .badge-work     { background: #e3f2fd; color: #1565c0; }
        .badge-personal { background: #f3e5f5; color: #7b1fa2; }

        .due-date {
            font-size: 0.78rem;
            color: #aaa;
        }

        .due-date.overdue {
            color: #ff5252;
            font-weight: 600;
        }

        /* Actions */
        .task-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.15s;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #f5f5f5;
        }

        /* Clear completed */
        .clear-row {
            margin-top: 20px;
            text-align: center;
        }

        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .clear-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* Progress bar */
        .progress-wrap {
            background: white;
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .meta-row { flex-wrap: wrap; }
            .add-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>✅ To-Do List</h1>
        <p class="subtitle">App 2 of 10 &mdash; CRUD &bull; localStorage &bull; Filtering</p>

        <!-- Add Task -->
        <div class="add-form">
            <h2>New Task</h2>
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="120">
            </div>
            <div class="meta-row">
                <select id="prioritySelect">
                    <option value="medium">⚡ Medium</option>
                    <option value="high">🔴 High</option>
                    <option value="low">🟢 Low</option>
                </select>
                <select id="categorySelect">
                    <option value="personal">🏠 Personal</option>
                    <option value="work">💼 Work</option>
                </select>
                <input type="date" id="dueDateInput">
                <button class="add-btn" id="addBtn">+ Add Task</button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrap" id="progressWrap" style="display:none">
            <div class="progress-label">
                <span>Progress</span>
                <span id="progressText">0 / 0 done</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Done</button>
            <button class="filter-btn" data-filter="work">💼 Work</button>
            <button class="filter-btn" data-filter="personal">🏠 Personal</button>
            <span class="summary" id="summary"></span>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList"></div>

        <!-- Clear Completed -->
        <div class="clear-row">
            <button class="clear-btn" id="clearBtn">Clear Completed</button>
        </div>
    </div>

    <script>
        // ── State ────────────────────────────────────────────────────────────
        // Tasks are stored as an array of objects in localStorage so they
        // survive page refreshes — a core technique for any persistent web UI.
        let tasks = loadTasks();
        let currentFilter = 'all';

        // ── Persistence ──────────────────────────────────────────────────────
        // localStorage is a key/value store built into every browser.
        // Values must be strings, so we serialize to JSON on save and
        // parse back on load.
        function saveTasks() {
            localStorage.setItem('todo-tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            try {
                return JSON.parse(localStorage.getItem('todo-tasks')) || [];
            } catch {
                return [];
            }
        }

        // ── CRUD Operations ──────────────────────────────────────────────────
        // Each task is a plain object. We give it a unique ID using
        // Date.now() — simple and good enough for a single-user app.
        function addTask(text, priority, category, dueDate) {
            tasks.push({
                id:        Date.now(),
                text:      text,
                priority:  priority,
                category:  category,  // 'work' | 'personal'
                dueDate:   dueDate,   // stored as "YYYY-MM-DD" string or ""
                done:      false,
                createdAt: new Date().toISOString()
            });
            saveTasks();
            render();
        }

        function toggleDone(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveTasks();
                render();
            }
        }

        function deleteTask(id) {
            // Array.filter returns a NEW array without the matching item.
            // We never mutate the original in place — a safer pattern.
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.done);
            saveTasks();
            render();
        }

        // ── Filtering ────────────────────────────────────────────────────────
        // A pure function: given all tasks + a filter name, return a subset.
        // Pure functions are easy to test and reason about — a key work-app
        // pattern.
        function getFilteredTasks(filter) {
            if (filter === 'active')   return tasks.filter(t => !t.done);
            if (filter === 'done')     return tasks.filter(t =>  t.done);
            if (filter === 'work')     return tasks.filter(t => t.category === 'work');
            if (filter === 'personal') return tasks.filter(t => t.category === 'personal');
            return tasks; // 'all'
        }

        // ── Date Helpers ─────────────────────────────────────────────────────
        function isOverdue(dueDate) {
            if (!dueDate) return false;
            const today = new Date().toISOString().slice(0, 10);
            return dueDate < today;
        }

        function formatDue(dueDate) {
            if (!dueDate) return '';
            const today = new Date().toISOString().slice(0, 10);
            if (dueDate === today) return '📅 Today';
            const tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
            if (dueDate === tomorrow) return '📅 Tomorrow';
            // Format as "Apr 25"
            const [y, m, d] = dueDate.split('-');
            return `📅 ${new Date(+y, +m - 1, +d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
        }

        // ── Render ───────────────────────────────────────────────────────────
        // One render function rebuilds the entire list from scratch.
        // This "single source of truth → re-render" pattern is the same
        // mental model used by React/Vue — you'll recognize it later.
        function render() {
            const list = document.getElementById('taskList');
            const filtered = getFilteredTasks(currentFilter);
            const doneCount = tasks.filter(t => t.done).length;
            const total = tasks.length;

            // Summary badge
            const remaining = tasks.filter(t => !t.done).length;
            document.getElementById('summary').textContent =
                total ? `${remaining} remaining` : '';

            // Progress bar
            const wrap = document.getElementById('progressWrap');
            if (total > 0) {
                wrap.style.display = '';
                const pct = Math.round((doneCount / total) * 100);
                document.getElementById('progressText').textContent = `${doneCount} / ${total} done`;
                document.getElementById('progressFill').style.width = pct + '%';
            } else {
                wrap.style.display = 'none';
            }

            // Clear button state
            document.getElementById('clearBtn').disabled = doneCount === 0;

            // Empty state
            if (filtered.length === 0) {
                const messages = {
                    all:    { icon: '🎉', text: 'No tasks yet. Add one above!' },
                    active: { icon: '✅', text: 'Nothing left to do — nice work!' },
                    done:   { icon: '📋', text: 'No completed tasks yet.' }
                };
                const m = messages[currentFilter];
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${m.icon}</div>
                        <div>${m.text}</div>
                    </div>`;
                return;
            }

            // Build task cards
            // We sort: incomplete first (by priority), then completed at bottom
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            const sorted = [...filtered].sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return (priorityOrder[a.priority] ?? 1) - (priorityOrder[b.priority] ?? 1);
            });

            list.innerHTML = sorted.map(task => {
                const overdue = !task.done && isOverdue(task.dueDate);
                return `
                <div class="task-card priority-${task.priority} ${task.done ? 'done' : ''}">
                    <div class="task-check ${task.done ? 'checked' : ''}"
                         onclick="toggleDone(${task.id})"></div>
                    <div class="task-body">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-meta">
                            <span class="badge badge-${task.priority}">${task.priority}</span>
                            <span class="badge badge-${task.category || 'personal'}">${task.category === 'work' ? '💼 Work' : '🏠 Personal'}</span>
                            ${task.dueDate ? `<span class="due-date ${overdue ? 'overdue' : ''}">${overdue ? '⚠️ Overdue · ' : ''}${formatDue(task.dueDate)}</span>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="icon-btn" onclick="deleteTask(${task.id})" title="Delete">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        // Security: never inject user text as raw HTML — always escape it first.
        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Event Wiring ─────────────────────────────────────────────────────
        function handleAdd() {
            const input = document.getElementById('taskInput');
            const text  = input.value.trim();
            if (!text) {
                input.focus();
                input.style.borderColor = '#ff5252';
                setTimeout(() => input.style.borderColor = '', 800);
                return;
            }
            const priority = document.getElementById('prioritySelect').value;
            const category = document.getElementById('categorySelect').value;
            const dueDate  = document.getElementById('dueDateInput').value;
            addTask(text, priority, category, dueDate);
            input.value = '';
            document.getElementById('dueDateInput').value = '';
            input.focus();
        }

        document.getElementById('addBtn').addEventListener('click', handleAdd);
        document.getElementById('taskInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleAdd();
        });

        document.getElementById('clearBtn').addEventListener('click', clearCompleted);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            });
        });

        // ── Init ─────────────────────────────────────────────────────────────
        render();
    </script>
</body>
</html>
