<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Picker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background-color: #16213e;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #e94560;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a8b2d8;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .result-box {
            background-color: #0f3460;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-meal {
            color: #e94560;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-empty {
            color: #a8b2d8;
            font-size: 16px;
        }

        .pick-btn {
            width: 100%;
            padding: 16px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background-color 0.2s;
            font-weight: bold;
        }

        .pick-btn:hover { background-color: #c73652; }

        .pick-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        hr {
            border: none;
            border-top: 1px solid #0f3460;
            margin-bottom: 24px;
        }

        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background-color: #0f3460;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e94560;
        }

        .add-btn {
            padding: 10px 18px;
            background-color: #0f3460;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .add-btn:hover { background-color: #1a4a8a; }

        .meal-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .meal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f3460;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #a8b2d8;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: #e94560; }

        .meal-count {
            text-align: center;
            color: #a8b2d8;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Meal Picker</h1>
        <p class="subtitle">Can't decide what to eat? Let fate decide.</p>

        <div class="result-box">
            <div class="result-meal" id="resultMeal" style="display:none"></div>
            <div class="result-empty" id="resultEmpty">Hit the button to pick a meal</div>
        </div>

        <button class="pick-btn" id="pickBtn" onclick="pickMeal()">Pick My Meal!</button>

        <hr>

        <div class="add-row">
            <input type="text" id="mealInput" placeholder="Add a meal..." onkeydown="if(event.key==='Enter') addMeal()">
            <button class="add-btn" onclick="addMeal()">+ Add</button>
        </div>

        <div class="meal-count" id="mealCount"></div>

        <div class="meal-list" id="mealList"></div>
    </div>

    <script>
        const DEFAULT_MEALS = [
            'Steak', 'Salmon', 'Tacos', 'Corto',
            'Burgers', 'Sushi', 'Pizza', 'Chinese', 'Martys', 'Chicken', 'Salad'
        ];

        function loadMeals() {
            const saved = localStorage.getItem('meals');
            return saved ? JSON.parse(saved) : DEFAULT_MEALS;
        }

        function saveMeals(meals) {
            localStorage.setItem('meals', JSON.stringify(meals));
        }

        function renderList() {
            const meals = loadMeals();
            const list = document.getElementById('mealList');
            const count = document.getElementById('mealCount');
            const pickBtn = document.getElementById('pickBtn');

            count.textContent = `${meals.length} meal${meals.length !== 1 ? 's' : ''} in rotation`;
            pickBtn.disabled = meals.length === 0;

            list.innerHTML = meals.map((meal, i) => `
                <div class="meal-item">
                    <span>${meal}</span>
                    <button class="delete-btn" onclick="deleteMeal(${i})">×</button>
                </div>
            `).join('');
        }

        function addMeal() {
            const input = document.getElementById('mealInput');
            const name = input.value.trim();
            if (!name) return;

            const meals = loadMeals();
            meals.push(name);
            saveMeals(meals);
            input.value = '';
            renderList();
        }

        function deleteMeal(index) {
            const meals = loadMeals();
            meals.splice(index, 1);
            saveMeals(meals);
            renderList();
        }

        function pickMeal() {
            const meals = loadMeals();
            if (meals.length === 0) return;

            const pick = meals[Math.floor(Math.random() * meals.length)];

            document.getElementById('resultEmpty').style.display = 'none';
            document.getElementById('resultMeal').style.display = 'block';
            document.getElementById('resultMeal').textContent = pick;
        }

        renderList();
    </script>
</body>
</html>
